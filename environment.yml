# --------------------------------------------------------
# Project-local Conda environment for the CARLA client.

# This environment can be created and used directly within the client folder.

# Usage:
#     1. Navigate to the client folder:
#           cd Z:\client
#     2. Create the environment in the "env" subfolder:
#           conda env create -f environment.yml -p ./env
#     3. Activate the environment:
#           conda activate Z:\client\env
# --------------------------------------------------------

channels:
  - defaults
dependencies:
